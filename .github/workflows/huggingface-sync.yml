name: Update European Accessibility Act Compliance Approach Hugging Face dataset

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eaa-compliance-huggingface-sync
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Double-FW/European-Accessibility-Act-EAA-Compliance-Approach' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install publishing dependencies
        run: python -m pip install -r huggingface/requirements.txt
      - name: Validate repository structure and synthetic cases
        run: python validation/check_repository.py
      - name: Test current-source export and publishing safeguards
        run: python -m unittest discover -s tests -p 'test_eaa_huggingface.py' -v
      - name: Build and validate European Accessibility Act Compliance Approach dataset
        run: python scripts/export_huggingface.py --output "${RUNNER_TEMP}/eaa-compliance-dataset"
      - name: Publish European Accessibility Act Compliance Approach dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/publish_huggingface.py --folder "${RUNNER_TEMP}/eaa-compliance-dataset"
